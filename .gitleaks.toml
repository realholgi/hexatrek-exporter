title = "HexaTrek credential checks"

[extend]
useDefault = true

[[rules]]
id = "firebase-session-token"
description = "Firebase session or image metadata token"
regex = '''(?i)["'](?:id_token|refresh_token|idToken|refreshToken|downloadTokens)["']\s*:\s*["']([A-Za-z0-9_.:/+=%-]{20,})["']'''
secretGroup = 1
keywords = ["id_token", "refresh_token", "idToken", "refreshToken", "downloadTokens"]

[[rules]]
id = "firebase-photo-access-url"
description = "Firebase image download token"
regex = '''firebasestorage\.googleapis\.com[^\s"'<>]*[?&](?:amp;)?token=([A-Za-z0-9_%+-]{20,})'''
secretGroup = 1
keywords = ["firebasestorage.googleapis.com"]

[[rules]]
id = "firebase-api-key"
description = "Firebase public API key in place of an example placeholder"
regex = '''AIza[A-Za-z0-9_-]{35}'''
keywords = ["AIza"]
