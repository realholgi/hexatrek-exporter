[project]
name = "hexatrek-exporter"
version = "0.1.0"
description = "HexaTrek CLI exports for OsmAnd and Komoot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2,<3",
    "pillow>=13.0.0,<14",
]

[project.urls]
Repository = "https://github.com/realholgi/hexatrek-exporter"
Issues = "https://github.com/realholgi/hexatrek-exporter/issues"

[project.scripts]
hexatrek = "hexatrek_exporter.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.6.1,<2",
    "pip-audit>=2.10.1,<3",
    "pre-commit>=4.7.0,<5",
    "pytest>=9.2.0,<10",
    "setuptools>=84.2.1,<85",
    "twine>=7.0.0,<8",
]

[build-system]
requires = ["setuptools>=77.0,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
