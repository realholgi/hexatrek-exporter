repos:
  - repo: local
    hooks:
      - id: private-artifacts
        name: Block private artifact filenames
        entry: Private data and credentials must stay outside Git
        language: fail
        types: []
        files: >-
          (?ix)(^|/)(data|exports|cache|secrets|credentials|\.omp|\.venv)/
          |(^|/)(\.env(?!\.example$)(\..+)?|(.*[-_])?session([-_].*)?\.json|(.*[-_])?credentials\.json|service-account[^/]*\.json)$
          |\.(pem|key|secret|p12|pfx|jks|keystore|gpx|zip|ldb|sst)$
        exclude: ^examples/synthetic/(?:source/stage-01\.gpx|expected/(?:komoot/stage-01|osmand/stage-01(?:-biwak|-no-biwak)?)\.gpx)$
        stages: [pre-commit, manual]
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks git --pre-commit --redact --staged --verbose --config .gitleaks.toml
        stages: [pre-commit]
      - id: gitleaks
        alias: gitleaks-history
        name: Scan committed history for secrets
        entry: gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts=--all
        stages: [manual]
        always_run: true
